name: ci-ubuntu-libnvme-compat

on:
  push:
  pull_request:

concurrency:
  group: ci-ubuntu-libnvme-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.libnvme == 'none' && 'no libnvme' || format('libnvme v{0}', matrix.libnvme) }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Each entry carries the meson flags that disable every
        # optional libnvme feature for that release (core library only).
        #
        # Option history (meson_options.txt):
        #   1.0 - 1.3   python is a combo (auto/true/false); json-c is mandatory
        #   1.3         adds libdbus
        #   1.4         python becomes a feature (auto/enabled/disabled);
        #               adds json-c and keyutils options
        #   1.7         adds tests
        #   1.12        adds liburing
        #   1.15        adds examples
        include:
          - libnvme: "none"
            meson_flags: ""

          - libnvme: "1.0"
            meson_flags: "-Dpython=false -Dopenssl=disabled -Ddocs=false"
          - libnvme: "1.1"
            meson_flags: "-Dpython=false -Dopenssl=disabled -Ddocs=false"
          - libnvme: "1.2"
            meson_flags: "-Dpython=false -Dopenssl=disabled -Ddocs=false"

          - libnvme: "1.3"
            meson_flags: "-Dpython=false -Dopenssl=disabled -Dlibdbus=disabled -Ddocs=false"

          - libnvme: "1.4"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false"
          - libnvme: "1.5"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false"
          - libnvme: "1.6"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false"

          - libnvme: "1.7"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.7.1"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.8"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.9"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.10"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.11"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.11.1"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Ddocs=false -Dtests=false"

          - libnvme: "1.12"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.13"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false"
          - libnvme: "1.14"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false"

          - libnvme: "1.15"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false -Dexamples=false"
          - libnvme: "1.16"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false -Dexamples=false"
          - libnvme: "1.16.1"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false -Dexamples=false"
          - libnvme: "1.16.2"
            meson_flags: "-Dpython=disabled -Dopenssl=disabled -Dlibdbus=disabled -Djson-c=disabled -Dkeyutils=disabled -Dliburing=disabled -Ddocs=false -Dtests=false -Dexamples=false"

    env:
      LIBNVME_VERSION: ${{ matrix.libnvme }}
      LIBNVME_MESON_FLAGS: ${{ matrix.meson_flags }}
      LIBNVME_CONFIGURE_FLAG: ${{ matrix.libnvme == 'none' && '--without-libnvme' || '--with-libnvme' }}
      BASE_CFLAGS: "-O2 -g -Werror -Wimplicit -Wimplicit-function-declaration -Wmissing-field-initializers"
      BASE_CPPFLAGS: "-Wno-error=cpp"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch -V to log build/OS info
        run: |
          sed -i '/printf( "%s version %s/a\            nwipe_options.nogui = 1;\n            nwipe_log_buildinfo();\n            nwipe_log_OSinfo();' src/options.c
          grep -q 'nwipe_log_OSinfo' src/options.c || { echo "sed patch did not apply"; exit 1; }
          grep -A4 'printf( "%s version %s' src/options.c

      - name: Update system packages
        run: |
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            bash \
            automake \
            make \
            curl \
            libncurses-dev \
            libevent-dev \
            libparted-dev \
            libconfig-dev \
            hdparm \
            dmidecode \
            smartmontools \
            autoconf \
            gcc \
            g++ \
            linux-libc-dev \
            meson \
            ninja-build \
            libjson-c-dev \
            pkg-config \
            wget \
            ca-certificates \
            libssl-dev \
            git \
            libdbus-1-dev \
            libsystemd-dev \
            uuid-dev

      - name: Build libnvme v${{ matrix.libnvme }}
        if: matrix.libnvme != 'none'
        run: |
          cd /tmp

          wget "https://github.com/linux-nvme/libnvme/archive/refs/tags/v${LIBNVME_VERSION}.tar.gz"

          tar xvfz "v${LIBNVME_VERSION}.tar.gz"

          cd "libnvme-${LIBNVME_VERSION}"

          echo "meson flags: ${LIBNVME_MESON_FLAGS}"

          meson setup .build ${LIBNVME_MESON_FLAGS}
          meson compile -C .build

          sudo meson install -C .build
          sudo ldconfig

      - name: Configure library paths
        if: matrix.libnvme != 'none'
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/local/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify libnvme v${{ matrix.libnvme }}
        if: matrix.libnvme != 'none'
        run: |
          pkg-config --modversion libnvme
          pkg-config --cflags --libs libnvme

      - name: Generate autogen files
        run: |
          ./autogen.sh

      - name: Configure nwipe
        run: |
          ./configure \
            "$LIBNVME_CONFIGURE_FLAG" \
            CFLAGS="$BASE_CFLAGS" \
            CPPFLAGS="$BASE_CPPFLAGS"

      - name: Compile nwipe
        run: |
          make \
            CFLAGS="$BASE_CFLAGS" \
            CPPFLAGS="$BASE_CPPFLAGS"

      - name: Verify nwipe
        run: |
          ldd ./src/nwipe || true
          sudo ./src/nwipe -V
